[package]
name = "oanda_rs"
version = "0.4.7"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenv = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rustopus = { git = "https://github.com/nimanoori22/rustopus", rev = "3d2b8120343e58b3ed7c92052c54700a164afa51" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "1.0.63"
tokio = { version = "1.36.0", features = ["full"] }
tower-layer = "0.3"
tower-service = "0.3"
futures = "0.3.30"

[dev-dependencies]
wiremock = "0.6.5"
